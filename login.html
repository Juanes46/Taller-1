<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&di
    splay=swap" rel="stylesheet">

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg" href="./logos/favicon.svg">

    <title>Login</title>

</head>

<body>
    <div class="login">
        <div class="form-container">
            <img src="logos/logo.svg" alt="logo" class="logo">

            <form action="/" class="form">
                <label for="password" class="label">Email address</label>
                <input type="password" id="password" placeholder="email@uniboyaca.edu.co" class="input input-password">

                <label for="new-password" class="label">Password</label>
                <input type="password" id="new-password" placeholder="**********" class="input input-password">

                <input type="submit" value="Log in" class="primary-button login-button">

                <a href="" class="text-red">Forgot my password</a>

                <p>

                </p>

                <input type="submit" value="Sing up" class="sing login-button">

            </form>
        </div>
    <div>
    </div>



</body>

</html>
